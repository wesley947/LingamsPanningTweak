name: Build and optionally publish Pre2 panning preview

on:
  push:
    branches:
      - preview/1.23.0-pre.2-water-drift
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download official Vintage Story 1.23.0-pre.2 server binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://cdn.vintagestory.at/gamefiles/pre/vs_server_win-x64_1.23.0-pre.2.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'vs-pre2-server.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'vs-pre2-server'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $api = Get-ChildItem -LiteralPath $extract -Filter 'VintagestoryAPI.dll' -Recurse -File | Select-Object -First 1
          if ($null -eq $api) { throw 'VintagestoryAPI.dll not found in Pre2 server package' }
          $game = $api.DirectoryName
          foreach ($required in @('Mods\VSSurvivalMod.dll', 'Lib\0Harmony.dll')) {
            if (-not (Test-Path (Join-Path $game $required))) { throw "Missing $required in $game" }
          }
          "VINTAGE_STORY=$game" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Build references: $game"

      - name: Compile mod against Pre2 game libraries
        shell: pwsh
        run: dotnet build .\PanningMod.csproj --configuration Release

      - name: Create prerelease ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -Path '.\bin\Release' -Filter 'LingamsPanningTweak.dll' -Recurse -File | Select-Object -First 1
          if ($null -eq $dll) { throw 'Mod DLL missing after build' }
          $stage = Join-Path $env:RUNNER_TEMP 'lingamspanningtweak-stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage 'LingamsPanningTweak.dll')
          Copy-Item -LiteralPath '.\modinfo.json' -Destination $stage
          Copy-Item -LiteralPath '.\modicon.png' -Destination $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath '.\lingamspanningtweak_1.1.0-pre.2_vs1.23.0-pre.2.zip' -Force

      - name: Upload prerelease ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingamspanningtweak-1.1.0-pre.2-vs1.23.0-pre.2
          path: lingamspanningtweak_1.1.0-pre.1_vs1.23.0-pre.2.zip
          if-no-files-found: error

      # Only publish when the final commit explicitly opts in; normal pushes
      # still run build+packaging but cannot accidentally publish a release.
      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-pre2]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create 'v1.1.0-pre.2' '.\lingamspanningtweak_1.1.0-pre.2_vs1.23.0-pre.2.zip' --title "Lingam's Panning Tweak v1.1.0-pre.2 (VS 1.23.0-pre.2)" --notes-file '.\RELEASE-NOTES-1.1.0-pre.2.md' --prerelease --target $env:GITHUB_SHA
